openapi: 3.1.0
info:
  title: Example API
  version: 1.4.0
servers:
  - url: /
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
