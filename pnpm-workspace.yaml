  - undici-types@6.21.0

shellEmulator: true

overrides:
  dompurify: '>=3.4.17'
  launch-editor: '>=2.14.2'
  shell-quote: '>=1.11.0'
  source-map-js: 1.2.2
  vite: '>=8.3.3'
  why-is-node-running: 3.2.1

allowBuilds:
  esbuild: true
