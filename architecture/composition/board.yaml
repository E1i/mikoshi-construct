id: board
title: construct board composition
description: >-
  `board` in `src/program.ts` is the composition root. It refuses a flag it cannot honour, then reads the
  two sources, each through its own reader and joined to nothing: the ladder's own record,
  `.construct/runs.jsonl`, through `readLedger`, and the pull request list that `gh pr list` wrote, from
  the file `--prs` names or from stdin. The CLI spawns no `gh`: the list is handed over, so the spawn row of
  the security invariants stands. `readBoard` turns what was read into items, `buildView` decides which are
  shown, stale, open or merged, and `printBoard` or `boardJson` renders it. With `--every` the root repeats the
  read and the render for each frame and clears the screen between them. Nothing is written: not the board,
  not a frame, not a record.
doc: architecture/board.md
boundaries:
