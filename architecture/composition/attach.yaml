id: attach
title: construct attach composition
description: >-
  `runAttach(ui, options, prompter)` in `src/commands/attach/index.ts` is the composition root: the
  refusals run first and every one of them exits before a byte is written; then the harness command
  comes from a flag or a prompt; then the carriers are planned, the exclude block, the nine carriers, the
  guard entry and the record are written in that order. `--entry` is routed in `src/program.ts` before
  `runAttach`, prints the entry protocol and writes nothing. Dotted edges are wiring, solid edges are the flow.
doc: architecture/attach.md
boundaries:
  - id: entry
    label: Entry
  - id: refuse
    label: Refuse · before any write
  - id: configure
    label: Configure
  - id: materialize
    label: Materialize
nodes:
  - id: cli
    label: construct attach (citty, alias jack-in)
    path: src/program.ts
    boundary: entry
  - id: run
    label: runAttach
    path: src/commands/attach/index.ts
    boundary: entry
  - id: refusals
    label: twelve refusals, in order
    path: src/commands/attach/refusals.ts
    boundary: refuse
  - id: detect
    label: isEmptyDir(dir)
    path: src/detect/layout.ts
    boundary: refuse
  - id: carrierset
    label: ATTACH_CARRIERS, ATTACH_GUARD
    path: src/presets/index.ts
    boundary: refuse
  - id: indexreader
    label: readTrackedPaths · is the settings file tracked
    path: src/commands/detach/index-reader.ts
  - id: earlier
    label: 'templates/attach: entry protocol, known set, classifyCollisions by sha256'
    path: src/commands/attach/earlier.ts
    boundary: refuse
  - id: prompts
    label: prompter (clack) or --harness
    path: src/ui/prompts.ts
    boundary: configure
  - id: carriers
    label: planCarriers, directoriesToCreate
    path: src/commands/attach/carriers.ts
    boundary: materialize
  - id: plan
    label: planMaterialize
    path: src/materialize/plan.ts
    boundary: materialize
  - id: exclude
    label: .git/info/exclude block
    path: src/commands/attach/exclude.ts
    boundary: materialize
  - id: strategies
    label: appendBlock, gitignore markers
    path: src/materialize/strategies.ts
    boundary: materialize
  - id: apply
    label: writeCarriersExclusively (wx)
    path: src/commands/attach/write.ts
    boundary: materialize
  - id: settings
    label: 'commit guard entry · .claude/settings.local.json: read, append, write by rename'
    path: src/commands/attach/settings.ts
    boundary: materialize
  - id: record
    label: .construct/attach.json
    path: src/commands/attach/record.ts
    boundary: materialize
  - id: rollback
    label: rollbackAttach · own files by sha, exclude restored byte for byte
    path: src/commands/attach/rollback.ts
    boundary: materialize
edges:
  - {from: cli, to: run, kind: sequence}
  - {from: run, to: refusals, kind: sequence}
  - {from: refusals, to: detect, kind: wires}
  - {from: refusals, to: carrierset, kind: wires, label: collision}
  - {from: refusals, to: settings, kind: wires, label: 'unreadable, guard entry already there'}
  - {from: refusals, to: indexreader, kind: wires, label: settings file tracked; unreadable index}
  - {from: cli, to: earlier, kind: sequence, label: '--entry: print the protocol, nothing else runs'}
  - {from: refusals, to: earlier, kind: wires, label: 'collision: sha256 per path against the known set'}
  - {from: refusals, to: prompts, kind: sequence, label: none fired}
  - {from: prompts, to: carriers, kind: sequence, label: harness command}
  - {from: carriers, to: plan, kind: wires}
  - {from: carriers, to: carrierset, kind: wires}
  - {from: carriers, to: exclude, kind: sequence, label: 'nine targets and the settings file, after confirm'}
  - {from: exclude, to: strategies, kind: wires}
  - {from: exclude, to: apply, kind: sequence, label: block written}
  - {from: apply, to: settings, kind: sequence, label: carriers and guard written}
  - {from: settings, to: record, kind: sequence, label: created flags; sha256 of each file}
  - {from: settings, to: rollback, kind: sequence, label: unreadable or guarded at write → refused}
  - {from: apply, to: rollback, kind: sequence, label: EEXIST → refused COLLISION}
