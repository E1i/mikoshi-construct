id: doctor
title: construct doctor composition
description: >-
  `runDoctor(root)` in `src/commands/doctor/index.ts` is the composition root, and it reads two
  separate authorities. From `construct.json`, through `upgradeManifest`, come the provenance
  verdicts — baseline files, discovery markers, marker provenance, the harness script and contract
  paths, the recorded tests the recorded runner config does not collect, and the version gap, which
  replays today's templates through the sync engine's own classification and counts the paths a sync
  would add or update. From `construct.model.json` comes the knowledge family: every verdict renders
  a claim's enforcement, and where the chain stops is the model's own `selectPath`, so `doctor`
  derives no state of its own and holds none. A repository with no model gets no verdicts rather than
  an error. Both families fan into `printDoctor`, which states the boundary — nothing from the
  inspected repository is executed, so nothing is said about whether the harness passes — and ends
  with one you-are-here line. Provenance readings, the version gap and the knowledge family are
  reported, never gated: none sets an exit code, and a replay that cannot run leaves the count
  unestablished rather than failing the command. `doctor` executes nothing from the repository it
  inspects and writes nothing, including the manifest it just normalised.
doc: architecture/doctor.md
