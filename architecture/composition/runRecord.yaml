id: runRecord
title: construct run-record composition
description: >-
  `runRecord(text, place, ladderRun?)` in `src/commands/run-record.ts` is the composition root of the
  one call step 4 of `/implement` makes, in the factory and in a generated repository alike. It parses
  the record with the ledger's own `parseLedgerLine` and refuses a line that does not parse or that
  names a field outside `LEDGER_FIELDS`, so nothing is written for a refused record. Then it picks the
  adapter, and the choice lives here, never in the skill: `wiredBusOf` resolves the bus path the
  factory would use for the directory. Where none exists the record is appended as one line to
  `.construct/runs.jsonl` through `appendLedgerLine`, the module that owns that file. Where one exists
  the published CLI does not write to it: the record goes, as one `ladder.run` event with its card
  from `CONSTRUCT_CARD` or the leading `#N` of the task and its dedupe key the sha of the payload,
  through the `ladderRun` port that the factory bin `construct-intake run-record` wires in
  (`busLadderRun` in `scripts/intake/intake.ts`), so a repeated call adds no second event; with no
  port the command refuses and names the bus. The readers follow the same choice: `runSourceOf` in
  `scripts/ladder/ledger.ts` reads the card's `ladder.run` event where a bus is wired, and the tree's
  file line where none is or where the bus holds no run of the card after the mark, so a step 4 that
  still writes the file is read too and no reader misses a run. `printRunRecord` names the adapter and the target; a refusal
  exits 2.
