id: runRecord
title: construct run-record composition
description: >-
  `runRecord(text, place)` in `src/commands/run-record.ts` is the composition root, and the one call
  step 4 of `/implement` makes in the factory and in a generated repository alike. It parses the
  record with the ledger's own `parseLedgerLine` and refuses a line that does not parse or that names
  a field outside `LEDGER_FIELDS`, so nothing is written for a refused record. Then it picks the
  adapter, and the choice lives here, never in the skill: `wiredBusOf` resolves the bus path the
  factory would use for the directory, and where that bus exists the record is appended as one
  `ladder.run` event, its card taken from `CONSTRUCT_CARD` or the leading `#N` of the task, its dedupe
  key the sha of the payload, so a repeated call adds no second event. Where no bus is wired the
  record is appended as one line to `.construct/runs.jsonl` through `appendLedgerLine`, the module that
  owns that file. The readers follow the same choice: `runSourceOf` in `scripts/ladder/ledger.ts`
  reads the bus where one is wired and the tree's file where none is, so no reader stays on a file
  nobody writes. `printRunRecord` names the adapter and the target; a refusal exits 2.
