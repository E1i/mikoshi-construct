id: graph
title: construct graph composition
description: >-
  `construct graph` draws what a repository claims and the evidence under it. `modelPicture` and
  `modelGraph` in `src/commands/graph.ts` resolve the directory, read `construct.model.json` through
  `readModel` — which refuses a record written by a later build rather than reading it partially —
  and derive the state of every claim and hypothesis with `deriveModelState`, which looks only at the
  files the facts name. Everything after that is a rendering of that one reading, never a second
  derivation: `printGraph` writes the Mermaid text to stdout, and `--out` renders the same graph as
  one self-contained HTML file. A repository with no model, or a model holding nothing, is a state
  rather than an error — the picture carries where it stopped, `printGraph` says so in one line, and
  the command exits 0 having drawn nothing. The page is the only write and it goes to the path the
  flag names, never into the repository being read.
doc: architecture/graph.md
boundaries:
