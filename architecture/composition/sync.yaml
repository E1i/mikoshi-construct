id: sync
title: construct sync composition
description: >-
  Two entry points share one replay. `runSync(root, version)` in `src/commands/sync/index.ts` reads
  `construct.json`, replays today's template groups for the preset the manifest recorded, classifies
  every path into one of the eight classes, counts them, and hands the report to `printSync` or to
  `syncJson`; it writes nothing. `applySync(root, version)` replays the same evidence and writes only
  what `isWritable` allows — `add` and `update` where the strategy is `create` or `append-block`,
  never a `merge-json` target, a `conflict`, an `unknown`, a `removed` or a `foreign` path — then
  records the owned view and the template variant of each written path in the manifest's `sync`
  branch, leaving the branch `init` wrote untouched. Before an append-block target is classified,
  `establishVariant` settles which template variant wrote it: the variant `init` recorded, else the
  sole variant the templates carry, else the one whose rendering matches the recorded sha. Where
  nothing settles it the path reads `unknown`, is written in no mode, and is reported under its own
  reason rather than as a conflict. A block target is spliced between the markers the present file already carries, so every
  byte outside them and every filled discovery body survives. The write effect an append-block target
  carries travels on the classification, so both the report and the apply output print it rather than
  restating it. The last line names the version that materialized the repository against the version
  reading it, and the exit code is set by the `add` and `update` counts alone — by what remained
  unwritten, under `--apply`.
