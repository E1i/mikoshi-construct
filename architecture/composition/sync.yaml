id: sync
title: construct sync composition
description: >-
  Two entry points share one replay. `runSync(root, version)` in `src/commands/sync/index.ts` reads
  `construct.json`, replays today's template groups for the preset the manifest recorded, classifies
  every path into one of the classes in `PATH_CLASSES`, counts them, and hands the report to
  `printSync` or to `syncJson`; it writes nothing. `applySync(root, version)` replays the same
  evidence and writes only what `isWritable` allows — `add`, `update` and `template-moved-on` where
  the strategy is `create` or `append-block`, never a `merge-json` target, a `conflict`, a
  `block-edited`, a `record-vars-edited`, an `unknown`, a `removed` or a `foreign` path — then
  records the owned view and the template variant of each written path in the manifest's `sync`
  branch, and for a block target the owned-view sha and the vars it was written with, leaving the
  branch `init` wrote untouched. A block target whose record carries that sha and vars snapshot
  (manifest version 6, decision 0032) reads `block-edited` when its owned view differs from the sha,
  else `record-vars-edited` when the record's `vars` differ from the snapshot, else `keep` or
  `template-moved-on`. Any other append-block target is classified after `establishVariant` settles
  which template variant wrote it: the variant `init` recorded, else the sole variant the templates
  carry, else the one whose rendering matches the recorded sha. Where nothing settles it the path
  reads `unknown`, is written in no mode, and is reported under its own reason rather than as a
  conflict, saying the record predates the fields that would answer. A block target is spliced
  between the markers the present file already carries, so every byte outside them and every filled
  discovery body survives. The write effect an append-block target carries travels on the
  classification, so both the report and the apply output print it rather than restating it. The
  last line names the version that materialized the repository against the version reading it, and
  the exit code is set by the `add`, `update` and `template-moved-on` counts alone — by what remained
  unwritten, under `--apply`.
