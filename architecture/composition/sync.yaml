id: sync
title: construct sync composition
description: >-
  `runSync(root, version)` in `src/commands/sync/index.ts` is the composition root: it reads
  `construct.json`, replays today's template groups for the preset the manifest recorded, classifies
  every path into one of the seven classes, counts them, and hands the report to `printSync` or to
  `syncJson`. This version reports and writes nothing — no file, no manifest. The write effect an
  append-block target carries travels on the classification, so the report prints it rather than
  restating it. The last line names the version that materialized the repository against the version
  reading it, and the exit code is set by the `add` and `update` counts alone.
doc: architecture/sync.md
