id: cost
title: construct cost composition
description: >-
  `costReport(cwd)` in `src/commands/cost/index.ts` is the composition root. It resolves the runtime
  first — the environment variables a coding agent sets, and only failing those the `ai` the manifest
  recorded — then picks the `CostSource` for it. The contract has one implementation: Claude Code,
  which reads the session files under `~/.claude/projects/<key>` and sums token counts per workflow
  run through `usage.ts`; any other runtime is `unsupported`, reported rather than guessed at. In
  parallel the root reads the ladder's own record, `.construct/runs.jsonl`, which `/implement` appends
  to. Where both sides can be read, `reconcile` joins what the ladder said it did to what the session
  files show it spent, and the two are reported side by side rather than merged into one number.
  `recordedSteps` splits every run the ledger names into its steps — role, attempt, effort, tokens and
  seconds of each agent, in start order — and appends a run not cached yet to `.construct/steps.jsonl`;
  a cached run is read from that line and never rewritten, so the split survives the transcripts. No
  message content is read past the token counts and the record times, and the step cache is the only
  file written. `COST_EXIT` maps the status to the exit code, so a run that could not be read is a
  non-zero exit rather than a zero total.
  `construct cost --expect` is a branch of the entry: `costExpect` reads the ledger and the step cache
  only, writes nothing, and calls neither `reconcile` nor the runtime resolution, so the forecast
  does not depend on the runtime: a run the step cache does not hold yet is split from the session
  files in memory and never appended. `expect.ts` is the one calculation `scripts/ghosts`
  also calls.
