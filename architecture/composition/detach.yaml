id: detach
title: construct detach composition
description: >-
  `runDetach(ui, options)` in `src/commands/detach/index.ts` is the composition root: every read —
  the record, the exclude block, the git index, the class of each recorded file — happens before any
  write, and each refusal leaves the tree as it found it; then the files, their emptied directories,
  the exclude block and the record are removed in that order. Dotted edges are wiring, solid edges
  are the flow.
doc: architecture/detach.md
