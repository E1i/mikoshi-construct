    boundary: remove
  - id: remove
    label: files by sha, empty directories, runtime files, run directories, .construct/browser, exclude block, record
    path: src/commands/detach/remove.ts
    boundary: remove
  - id: strategies
    label: removeBlock
    path: src/materialize/strategies.ts
    boundary: remove
  - id: directories
    label: removeEmptyDirectories
    path: src/commands/attach/rollback.ts
    boundary: remove
  - id: original
    label: drop the copy, its key directory, the attach directory when empty
    path: src/commands/attach/original.ts
    boundary: remove
edges:
  - {from: cli, to: run, kind: sequence}
  - {from: run, to: record, kind: sequence}
  - {from: run, to: exclude, kind: wires, label: block paths}
  - {from: run, to: indexreader, kind: sequence, label: record found; unreadable index → refused}
  - {from: indexreader, to: classify, kind: sequence, label: tracked set}
  - {from: classify, to: settings, kind: sequence, label: then the guard entry}
  - {from: settings, to: copy, kind: sequence, label: then the kept copy}
  - {from: copy, to: runtime, kind: sequence, label: then the runtime files}
  - {from: runtime, to: restore, kind: sequence, label: nothing changed; entry out first}
  - {from: restore, to: remove, kind: sequence}
  - {from: indexreader, to: settings, kind: wires, label: tracked set}
  - {from: indexreader, to: runtime, kind: wires, label: tracked set}
  - {from: runtime, to: runtimelist, kind: wires}
  - {from: remove, to: directories, kind: wires}
  - {from: remove, to: original, kind: sequence, label: 'after .construct/browser, before the exclude block'}
  - {from: remove, to: exclude, kind: wires}
  - {from: exclude, to: strategies, kind: wires}
