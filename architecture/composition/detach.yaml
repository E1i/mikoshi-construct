id: detach
title: construct detach composition
description: >-
  `askDetach(ui, options, prompter)` in `src/commands/detach/index.ts` is the composition root: it runs
  plan → preview → confirm or `--yes` → apply. `planDetach` does every read — the record, the exclude
  block, the git index, the class of each recorded file, the kept copy of the settings file (path
  confined, sha256 checked) and the classification of the runtime files — before any write, and each
  refusal leaves the tree as it found it. The preview lists what goes, each daemon run directory, the
  factory's directory beside the repository with its handoff, archive and decisions, and the Engram,
  with its number of paths and the total; then a confirmation, or `--yes`, and without either nothing is
  removed and detach exits as aborted. Only then the factory beside the repository, the guard entry (restored from
  the copy or cut), the files, their emptied directories, the runtime files, the run directories,
  `.construct/browser`, the copy, the exclude block and the record are removed in that order. Dotted edges
  are wiring, solid edges are the flow.
doc: architecture/detach.md
