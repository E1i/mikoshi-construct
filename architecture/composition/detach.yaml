id: detach
title: construct detach composition
description: >-
  `runDetach(ui, options)` in `src/commands/detach/index.ts` is the composition root: every read —
  the record, the exclude block, the git index, the class of each recorded file, the kept copy of the
  settings file (path confined, sha256 checked) and the classification of the runtime files — happens
  before any write, and each refusal leaves the tree as it found it; then the guard entry (restored from
  the copy or cut), the files, their emptied directories, the runtime files, the run directories,
  `.construct/browser`, the copy, the exclude block and the record are removed in that order. Dotted edges
  are wiring, solid edges are the flow.
doc: architecture/detach.md
boundaries:
  - id: entry
    label: Entry
  - id: read
    label: Read · before any write
  - id: classify
    label: Classify
  - id: remove
    label: Remove
nodes:
  - id: cli
    label: construct detach (citty, alias jack-out)
    path: src/program.ts
    boundary: entry
  - id: run
    label: runDetach
    path: src/commands/detach/index.ts
    boundary: entry
  - id: record
    label: readAttachRecord
    path: src/commands/attach/record.ts
    boundary: read
  - id: exclude
    label: pathsInExcludeBlock, removeExcludeBlock
    path: src/commands/attach/exclude.ts
    boundary: read
  - id: indexreader
    label: readTrackedPaths · .git/index, .git/config
    path: src/commands/detach/index-reader.ts
    boundary: read
  - id: classify
    label: adopted → absent → changed → remove
    path: src/commands/detach/classify.ts
    boundary: classify
  - id: settings
    label: 'guard entry: adopted → absent → changed → remove'
    path: src/commands/attach/settings.ts
    boundary: classify
  - id: copy
    label: 'pre-image: path confined, sha256 checked; mismatch → refused'
    path: src/commands/detach/restore.ts
    boundary: read
  - id: runtime
    label: 'runtime files: on the list, untracked, not held at attach'
    path: src/commands/detach/runtime.ts
    boundary: classify
  - id: runtimelist
    label: ATTACH_RUNTIME_FILES
