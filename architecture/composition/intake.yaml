id: intake
title: construct intake composition
description: >-
  `construct intake` turns a draft of sliced cards into parking cards. The slicing itself — how many
  cards a retelling holds, what each one touches, what the retelling left unclear — is the intake
  skill's, and arrives as the `--draft` JSON; the CLI runs no model and no `gh`. `runIntake` in
  `src/commands/intake/index.ts` is the composition root. It reads the draft and the numbers `--taken`
  hands over, in sequence: `parseDraft` refuses a draft that lacks a field with no default rather than
  inventing it, and `parseTaken` refuses anything that is not a number. The numbers are the next free
  after every number taken in the parking directory and in `--taken`, because card numbers are shared
  with pull requests and issues. `checkDraft` corrects or marks unclear, by facts, each wrong path,
  named number, contour, decision, closed depends/blocks and command-less witness. It reads the
  repository under --dir only through `facts.ts` and closed tasks from --journal through
  `closedTasks` in `src/card/closed.ts`. Each correction is a `corrected:` line. `sliceCards` resolves `depends` by name inside the draft, adds the
  matching `blocks`, defaults only `contour` and `decision` and marks each default as an `unclear:`
  line, keeps every card with an unclear line at `who: window`, renders the card line and the file with
  the renderers that sit beside the card grammar in `src/card/`, and parses every file back with
  `parseParkingFile` — the one parser `task:start` and the shift read. One refused card refuses the
  whole draft, and nothing is written. `--dry-run` prints the cards; otherwise, when any card carries a correction
  and neither `--auto-confirm` nor a `--confirm` naming the hash of exactly these cards was given,
  `confirm.ts` holds them: nothing is written, the corrections and the token are printed, and the exit
  is 2. A confirmed or correction-free draft is written card by card, once, exclusively, into the
  parking directory, which is outside the repository, so an attached repository gets no file; then
  each card gets an `intake` line in --journal naming its confirmation (`person`, `auto` or `none`) and
  its corrections. `--admit <parking>/<id>.md` routes to `runAdmit` in `src/commands/intake/admit.ts`
  instead, for a card parked before the intake door: it parses the file with `parseParkingFile`, runs
  the same `checkDraft` under the card's own number, holds a corrected card behind the same
  confirmation token, rewrites only the card line, the touches line and the appended `corrected:` and
  `unclear:` lines, and writes one `intake` line with `source: admit`; a card whose line the journal
  already admitted is left alone.
doc: architecture/intake.md
boundaries:
  - id: entry
    label: Entry
  - id: read
    label: Read · the draft, the taken numbers, the journal and the repository
  - id: slice
    label: Number, render, check
  - id: write
    label: Write · the parking and the journal
nodes:
  - id: cli
    label: construct intake (citty)
    path: src/program.ts
    boundary: entry
  - id: run
    label: runIntake · refuses without --draft or --taken, or a --dir that is no directory
    path: src/commands/intake/index.ts
    boundary: entry
  - id: admit
    label: runAdmit · --admit a parked card under its own number, no new number; nothing when the journal already admitted it
    path: src/commands/intake/admit.ts
    boundary: entry
  - id: draft
    label: parseDraft · a field with no default is refused, never invented
    path: src/commands/intake/draft.ts
    boundary: read
  - id: numbers
    label: parseTaken / parkedNumbers / nextFreeNumbers · after every number taken
    path: src/commands/intake/numbers.ts
    boundary: read
  - id: check
    label: checkDraft · touches, number, contour, decision, depends, blocks, witnesses checked by facts; every correction written, none applied silently
    path: src/commands/intake/check.ts
    boundary: read
  - id: facts
    label: repository facts · reads --dir and PATH, writes nothing
    path: src/commands/intake/facts.ts
    boundary: read
  - id: slice
    label: sliceCards · depends by name, defaults marked unclear, who window when unclear
    path: src/commands/intake/slice.ts
    boundary: slice
  - id: grammar
    label: cardLine / parkingFileText / parseParkingFile · the one card grammar
    path: src/card/parking.ts
    boundary: slice
  - id: confirm
    label: confirmationToken / awaitsConfirmation · corrections held until --confirm <token> or --auto-confirm
    path: src/commands/intake/confirm.ts
    boundary: slice
  - id: write
    label: <parking>/<id>.md · exclusive, or printed on --dry-run
    path: src/commands/intake/index.ts
    boundary: write
  - id: journal
    label: --journal · one intake line per parked card, its confirmation and corrections
    path: src/commands/intake/index.ts
    boundary: write
  - id: print
    label: printIntake · INTAKE_EXIT
    path: src/commands/intake/index.ts
    boundary: write
edges:
  - {from: cli, to: run, kind: route}
  - {from: cli, to: admit, kind: route}
  - {from: admit, to: grammar, kind: wires}
  - {from: admit, to: check, kind: sequence}
  - {from: admit, to: confirm, kind: sequence}
  - {from: admit, to: journal, kind: sequence}
  - {from: run, to: draft, kind: sequence}
  - {from: draft, to: numbers, kind: sequence}
  - {from: numbers, to: check, kind: sequence}
  - {from: check, to: slice, kind: sequence}
  - {from: check, to: facts, kind: wires}
  - {from: check, to: grammar, kind: wires}
  - {from: slice, to: grammar, kind: wires}
  - {from: slice, to: confirm, kind: sequence}
  - {from: confirm, to: write, kind: sequence}
  - {from: confirm, to: print, kind: sequence}
  - {from: write, to: journal, kind: sequence}
  - {from: journal, to: print, kind: sequence}
