replay:
  preset: node-library
  ai: claude
  projectName: mikoshi-construct
  vars: construct.json

differences:
  - path: .claude/commands/plan.md
    kind: content
    reason: >-
      The brief skeleton here carries the Sketch: line the Ghost launcher reads, and a factory block
      explains it; a generated repository has no launcher, so the template ships without both.
      tests/plan-factory-twin.test.ts holds the rest of the file byte-identical to the template.
  - path: .github/workflows/ci.yml
    kind: content
    reason: >-
      This repository is the generator, so its own CI runs an acceptance leg per preset on top of the
      quality gate the template ships; the template stays a single quality gate for a generated repo.
  - path: .github/workflows/security.yml
    kind: content
    reason: >-
      This repository merges through a merge queue, so the workflow carrying the required Secret scan
      also runs on merge_group; the template keeps pull_request and push, since a generated repository
      may not use a merge queue and the trigger would do nothing there.
  - path: .gitleaks.toml
    kind: content
    reason: >-
      The allowlist here exempts a construct manifest at any depth, because frozen manifests live
      under tests/fixtures as regression fixtures; the template keeps the root-anchored form, since a
      generated project keeps its manifest at the root and a wider exemption would silence more than
      it must.
  - path: .gitignore
    kind: content
    reason: >-
      An append-block target: init edits only the construct block, and the repository keeps its own
      ignore lines outside it.
  - path: AGENTS.md
    kind: content
    reason: >-
      Discovery is not reproducible. Init wrote the empty markers and the existing-file variant; the
      filled prose is the discovery command's output, recorded by provenance, never re-derived here.
  - path: architecture/decisions/README.md
    kind: skipped-at-init
    reason: >-
      Written by hand before the template existed, so the manifest does not record it; the template
      ships the empty index with the enforcement scale, while this copy carries the records this
      repository has actually taken.
  - path: architecture/principles.md
    kind: content
    reason: >-
      The section "Mikoshi — an organism, not a product" is tried here first, at the owner's decision
      of 2026-09-29; the template's copy stays as it was until the owner decides it ships to generated
      repositories.
  - path: architecture/open-questions.md
    kind: skipped-at-init
    reason: >-
      Written by `sync --apply`, not by init, so the record init froze does not hold it; the template
      ships the empty marker, and this copy holds the questions discovery moved out of AGENTS.md.
  - path: architecture/security-invariants.md
    kind: content
    reason: >-
      The invariants table is discovery output: the template ships the empty marker, this repository
      states the invariants it actually enforces and the check that enforces each one.
  - path: CLAUDE.md
    kind: content
    reason: >-
      An append-block target carrying this repository's own commands and a pointer to its layout and
      template conventions around the construct block init wrote.
  - path: package.json
    kind: content
    reason: >-
      Merged, not created: the published package keeps its own name, version, metadata, bin, scripts
      and dependencies, and init only added the keys that were missing.
  - path: pnpm-workspace.yaml
    kind: skipped-at-init
    reason: >-
      This repository builds its documentation with vitepress, whose vue and postcss chain resolves
      source-map-js below the patched 1.2.2 (GHSA-68fv-2mgg-jv7q), so it overrides that package; a
      generated repository has no vitepress, so the template keeps only the overrides every project needs.
  - path: eslint.config.mjs
    kind: skipped-at-init
    reason: >-
      Present before init ran, so init skipped it and the manifest never recorded it; this repository's
      config adds its own dependency-boundary and syntax-policy blocks on top of the template.
  - path: tsconfig.json
    kind: skipped-at-init
    reason: >-
      Present before init ran, so init skipped it; this repository's tsconfig.json extends the
      template's tsconfig.base.json but adds tsup.config.ts to include and keeps only tests/fixtures
      in exclude, instead of the template's node_modules/dist pair.
  - path: vitest.config.ts
    kind: skipped-at-init
    reason: >-
      Present before init ran, so init skipped it; this repository excludes the template fixtures and
      raises the test timeout for the init end-to-end suites.
  - path: .claude/settings.json
    kind: skipped-at-init
    reason: >-
      This repository's own settings carry its status line, permissions and its own hooks, and the
      construct materialized here before init wrote hook settings, so the manifest records no sha for
      it; the template carries only the three tab-window hook entries a generated repository starts with.
  - path: scripts/construct/window-hooks.mjs
    kind: absent-at-root
    reason: >-
      This repository runs its window hooks from its own .claude/hooks scripts, registered in its own
      .claude/settings.json, not from the carrier init writes; the carrier's identity with the attach
      window hook is held by tests/init.test.ts, not by a copy at the root.
  - path: .claude/agents/brief.md
    kind: skipped-at-init
    reason: >-
      This repository's brief agent names its own approval (pnpm ghosts:hash) and the CI jobs of its own
      workflows; the template names the repository's bus handoff and the /implement line the approval
      reads instead. The repository copy is owner-merged and changes only under its own card.
  - path: .claude/agents/review.md
    kind: skipped-at-init
    reason: >-
      This repository's review agent names its own verdict check (pnpm ghosts:verdict), the verdict
      schema and reviewDepth; the template ships the same rules worded for a generated repository's bus
      handoff, without those scripts. The repository copy is owner-merged.
  - path: .claude/commands/attached-discover.md
    kind: skipped-at-init
    reason: >-
      The repository copy words the one write it allows inside the repository, the high-effort list,
      after the prohibition; the template states it first. tests/attach.test.ts holds what attach and
      init write identical to each other.
  - path: .claude/commands/status.md
    kind: skipped-at-init
    reason: >-
      This repository's status command runs pnpm board from its own scripts; the template runs construct
      board, which is what a generated repository has.
  - path: .claude/skills/probe/SKILL.md
    kind: skipped-at-init
    reason: >-
      This repository's probe skill links window.md and AGENTS.md and closes through pnpm task:close; the
      template keeps the boundaries, the evidence classes and the close without them. The repository
      copy is owner-merged.
  - path: architecture/owner-merges.md
    kind: skipped-at-init
    reason: >-
      This repository's table is the owner's own, with the kinds its factory adds; the template is the
      default a generated repository starts from, which its owner then narrows or widens.
