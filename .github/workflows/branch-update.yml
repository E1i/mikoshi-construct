name: Branch update

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-update
  cancel-in-progress: false

jobs:
  update:
    name: Update the oldest queued pull request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          GH_TOKEN: ${{ secrets.BRANCH_UPDATE_TOKEN }}
        run: pnpm exec tsx scripts/ci/update-branch.ts
