# Changesets release: on every push to main, open or update the "Version Packages" pull request;
# when that pull request is merged, build and publish to npm.
#
# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. It works only once the package
# exists on npm and this repository + workflow are registered as a trusted publisher in the package's
# settings; the first version is published by hand. Registration is case-sensitive and the repository
# owner is `E1i`.
#
# The action major must match the Changesets major: v2 of the action reads the CHANGESETS_OUTPUT
# report that Changesets 3 writes. The v1 action instead scanned stdout for a `New tag:` line that
# Changesets 3 no longer prints, so it pushed no tag and created no GitHub release while still
# reporting success.
#
# The publish is staged with `npm stage publish`, which npm has from 11.15.0 (trusted publishing itself
# needs 11.5.1). The Node major pinned in .nvmrc ships npm 10, which has neither and publishes
# unauthenticated — the registry answers `404 Not Found - PUT`. So the job upgrades npm before
# publishing, and keeps the pinned Node so the harness runs where CI runs it.
#
# A staged version is installable only once a human approves it, so the stage id is uploaded as the
# release-stage artifact: Release verification reads it to tell a publish awaiting approval from one
# that is absent. `changeset tag` then writes the git-tag report the action turns into tags and
# GitHub releases, which `changeset publish` wrote before. The last step writes `npm stage approve <id>`
# into the run summary, with the id from that record, or says nothing was staged.
#
# When the action creates or updates the version pull request, its body gets a block of its own with
# the diff of architecture/security-invariants.md since the last release tag, or «без изменений».

name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a release that supports trusted publishing
        run: npm install --global "npm@^11.15.0"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run quality

      - name: Version or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Security invariants diff in the version pull request
        if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.pr-number != ''
        run: pnpm exec tsx scripts/release/security-diff.ts "${{ steps.changesets.outputs.pr-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the stage record
        uses: actions/upload-artifact@v7
        with:
          name: release-stage
          path: release-stage.json
          if-no-files-found: ignore

      - name: Stage command in the summary
        if: always()
        run: pnpm exec tsx scripts/release/stage-summary.ts
