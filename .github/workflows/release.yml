# Changesets release: on every push to main, open or update the "Version Packages" pull request;
# when that pull request is merged, build and publish to npm.
#
# Publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. It works only once the package
# exists on npm and this repository + workflow are registered as a trusted publisher in the package's
# settings; the first version is published by hand. Registration is case-sensitive and the repository
# owner is `E1i`.
#
# The action major must match the Changesets major: v2 of the action reads the CHANGESETS_OUTPUT
# report that Changesets 3 writes. The v1 action instead scanned stdout for a `New tag:` line that
# Changesets 3 no longer prints, so it pushed no tag and created no GitHub release while still
# reporting success.
#
# Trusted publishing needs npm 11.5.1 or newer. The Node major pinned in .nvmrc ships npm 10, which has
# no OIDC support and publishes unauthenticated — the registry answers `404 Not Found - PUT`. So the
# job upgrades npm before publishing, and keeps the pinned Node so the harness runs where CI runs it.

name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a release that supports trusted publishing
        run: npm install --global "npm@^11.5.1"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run quality

      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
