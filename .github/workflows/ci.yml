# Two gates on every pull request and push to main.
#
# quality    — the repository's own harness: composition check, lint, typecheck, tests.
# acceptance — what the CLI promises its users: an empty directory → `construct init` →
#              `pnpm install` → `pnpm run quality` is green, for every preset, on the Node
#              majors we support, with no manual edits. One leg installs under pnpm's
#              minimumReleaseAge policy, because a template range that only matches today's
#              publish fails a user's first install (see CLAUDE.md, version ranges).
#
# The acceptance legs run the built CLI the way a user runs the published one: dist/cli.js keeps its
# runtime dependencies external, so they are installed from the lockfile before it is invoked.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  acceptance:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [node-backend, node-frontend, node-library, monorepo]
        node: [22, 24]
        release-age: [0]
        include:
          - preset: node-backend
            node: 24
            release-age: 1440
    name: ${{ matrix.preset }} · node ${{ matrix.node }}${{ matrix.release-age != 0 && ' · minimumReleaseAge' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Install the runtime dependencies dist/cli.js does not bundle
        run: pnpm install --frozen-lockfile --prod

      - name: construct init
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          node dist/cli.js init --yes --preset ${{ matrix.preset }} --dir "$RUNNER_TEMP/acceptance" --plain

      - name: Apply the release-age policy
        if: matrix.release-age != 0
        run: echo "minimum-release-age=${{ matrix.release-age }}" >> "$RUNNER_TEMP/acceptance/.npmrc"

      - name: pnpm install
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm install

      - name: pnpm run quality
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm run quality

      - name: construct doctor
        working-directory: ${{ runner.temp }}/acceptance
        run: node "$GITHUB_WORKSPACE/dist/cli.js" doctor --plain
