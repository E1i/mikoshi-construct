# Three gates on every pull request and push to main.
#
# quality    — the repository's own harness: composition check, lint, typecheck, tests.
# acceptance — what the CLI promises its users: an empty directory → `construct init` →
#              `pnpm install` → `pnpm run quality` is green, for every preset, on the Node
#              majors we support, with no manual edits. One leg installs under pnpm's
#              minimumReleaseAge policy, because a template range that only matches today's
#              publish fails a user's first install (see CLAUDE.md, version ranges).
# contract-bump — the release bump the change requires: the semantic diff of contract/surface.json
#              against the latest release tag reachable from HEAD, compared with the strongest
#              changeset (decision 0030). It needs tags and history, so it checks out in full.
#
# Each acceptance leg installs the publishable tarball into a directory outside the repository and runs
# the installed binary. That is what publishing ships: the externals tsup leaves out of dist/cli.js must
# resolve from the installed package's own dependencies, `files` must carry templates/ or the first
# template read fails, and the `bin` wiring must point at the built entry. Running `node dist/cli.js`
# out of the working tree proves none of those.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality
      - run: pnpm build
      - name: Pack the publishable tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          retention-days: 1

  contract-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:bump

  acceptance:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [node-backend, node-frontend, node-library, monorepo]
        node: [22, 24]
        release-age: [0]
        include:
          - preset: node-backend
            node: 24
            release-age: 1440
    name: ${{ matrix.preset }} · node ${{ matrix.node }}${{ matrix.release-age != 0 && ' · minimumReleaseAge' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/

      - name: Install the packed CLI outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/cli-host"
          cd "$RUNNER_TEMP/cli-host"
          npm init -y
          npm install "$RUNNER_TEMP"/package/*.tgz
          echo "CONSTRUCT_BIN=$RUNNER_TEMP/cli-host/node_modules/.bin/construct" >> "$GITHUB_ENV"

      - name: construct init
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          "$CONSTRUCT_BIN" init --yes --preset ${{ matrix.preset }} --dir "$RUNNER_TEMP/acceptance" --plain

      - name: Apply the release-age policy
        if: matrix.release-age != 0
        run: echo "minimum-release-age=${{ matrix.release-age }}" >> "$RUNNER_TEMP/acceptance/.npmrc"

      - name: pnpm install
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm install

      - name: pnpm run quality
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm run quality

      - name: construct doctor
        working-directory: ${{ runner.temp }}/acceptance
        run: |
          "$CONSTRUCT_BIN" doctor --plain
