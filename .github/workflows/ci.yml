# Gates aggregated into the one required check `CI / required`.
#
# checks · lint · typecheck · vitest (two shards) · docs — the steps of package.json's `quality`,
#              split into parallel jobs; scripts/tests/ci/quality-steps.test.ts holds them to exactly
#              that list. They run on every change, the fast path included, because most of them read
#              docs/ and architecture/*.md. checks also runs scripts/release/version-pr-guard.ts, red on a
#              changeset-release/* pull request whose merged tree still carries a changeset.
# package    — builds and packs the publishable tarball the acceptance legs install. It runs on every
#              change and waits on nothing, so the preset matrix starts once both it and changes are done.
# acceptance — what the CLI promises its users: an empty directory → `construct init` →
#              `pnpm install` → `pnpm run quality` is green, for every preset, on the Node
#              majors we support, with no manual edits. One leg installs under pnpm's
#              minimumReleaseAge policy, because a template range that only matches today's
#              publish fails a user's first install (see CLAUDE.md, version ranges). It waits on
#              package and changes, not on the quality jobs, so they run side by side.
# contract-bump — the release bump the change requires: the semantic diff of contract/surface.json
#              against the latest release tag reachable from HEAD, compared with the strongest
#              changeset (decision 0030). It needs tags and history, so it checks out in full.
# required   — red when any job failed or was cancelled, or was skipped other than acceptance on
#              the fast path. The job runs scripts/ci/verdict.ts, which applies the
#              rule blockingJobs in scripts/ci/required.ts to the needs of this job; once every need
#              is green it merges the vitest shards' reports and checks that doctor reads this
#              repository's harness as checked (decision 0033), in the same job so the tail after
#              the slowest shard is one job, not two.
#
# The fast path is a pull request whose every changed path is on the allow-list in
# scripts/ci/fast-path.ts (docs/** and top-level architecture/*.md). Neither the tarball nor a generated
# project contains those files, so acceptance is skipped; every other job runs.
# merge_group and push always take the full path.
#
# Each acceptance leg installs the publishable tarball into a directory outside the repository and runs
# the installed binary. That is what publishing ships: the externals tsup leaves out of dist/cli.js must
# resolve from the installed package's own dependencies, `files` must carry templates/ or the first
# template read fails, and the `bin` wiring must point at the built entry. Running `node dist/cli.js`
# out of the working tree proves none of those.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      fast-path: ${{ steps.classify.outputs.fast-path }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames -z HEAD^1 HEAD | xargs -0 pnpm exec tsx scripts/ci/classify.ts
          else
            pnpm exec tsx scripts/ci/classify.ts
          fi

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm composition:check
      - run: pnpm model:check
      - run: pnpm privacy:check
      - run: pnpm exec tsx scripts/release/version-pr-guard.ts

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm lint --cache --cache-strategy content

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm typecheck --incremental --tsBuildInfoFile node_modules/.cache/tsc/typecheck.tsbuildinfo

  vitest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: vitest ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/2 --reporter=default --reporter=blob
      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm docs:pending
      - run: pnpm docs:anchors

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the publishable tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v7
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/*.tgz
          retention-days: 1

  contract-bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:bump
      - name: Self-check — a base generated from v0.17.2's code reads the change to 0f905ea as breaking
        run: |
          out="$(pnpm --silent contract:bump --base v0.17.2 --head 0f905ea 2>&1)"
          echo "$out"
          grep -qxF 'required: minor (breaking surface change)' <<<"$out" || { echo 'the self-check requires minor'; exit 1; }
          grep -qxF '  jsonKeys.doctor.noManifest.root: null → object' <<<"$out" || { echo 'the self-check reads no jsonKeys.doctor.noManifest.root: null → object'; exit 1; }

  acceptance:
    needs: [changes, package]
    if: needs.changes.outputs.fast-path != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [node-backend, node-frontend, node-library, monorepo]
        node: [22, 24]
        release-age: [0]
        include:
          - preset: node-backend
            node: 24
            release-age: 1440
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/package/

      - name: Install the packed CLI outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/cli-host"
          cd "$RUNNER_TEMP/cli-host"
          npm init -y
          npm install "$RUNNER_TEMP"/package/*.tgz
          echo "CONSTRUCT_BIN=$RUNNER_TEMP/cli-host/node_modules/.bin/construct" >> "$GITHUB_ENV"

      - name: construct init
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance"
          "$CONSTRUCT_BIN" init --yes --preset ${{ matrix.preset }} --dir "$RUNNER_TEMP/acceptance" --plain

      - name: Apply the release-age policy
        if: matrix.release-age != 0
        working-directory: ${{ runner.temp }}/acceptance
        run: |
          printf 'minimumReleaseAge: %s\n' "${{ matrix.release-age }}" >> pnpm-workspace.yaml

      - name: The release-age policy refuses a version younger than it
        if: matrix.release-age != 0
        working-directory: ${{ runner.temp }}/acceptance
        env:
          PROBE_RELEASE_AGE_MINUTES: 5256000
        run: |
          version=$(npm view typescript@latest version)
          probe=$(mktemp -d)
          sed "s/^minimumReleaseAge: .*/minimumReleaseAge: $PROBE_RELEASE_AGE_MINUTES/" pnpm-workspace.yaml > "$probe/pnpm-workspace.yaml"
          grep -qx "minimumReleaseAge: $PROBE_RELEASE_AGE_MINUTES" "$probe/pnpm-workspace.yaml" || { cat "$probe/pnpm-workspace.yaml"; echo "the probe policy line was not written"; exit 1; }
          echo '{"name":"release-age-probe","private":true}' > "$probe/package.json"
          if (cd "$probe" && pnpm add "typescript@$version") > "$probe/add.log" 2>&1; then cat "$probe/add.log"; echo "the policy let typescript@$version in under minimumReleaseAge $PROBE_RELEASE_AGE_MINUTES"; exit 1; fi
          grep -q ERR_PNPM_NO_MATURE_MATCHING_VERSION "$probe/add.log" || { cat "$probe/add.log"; echo "pnpm add failed for another reason"; exit 1; }
          echo "refused typescript@$version under minimumReleaseAge $PROBE_RELEASE_AGE_MINUTES: ERR_PNPM_NO_MATURE_MATCHING_VERSION"

      - name: pnpm install
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm install

      - name: Format the release-age policy with the project's own lint
        if: matrix.release-age != 0
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm exec eslint --fix pnpm-workspace.yaml

      - name: pnpm run quality
        working-directory: ${{ runner.temp }}/acceptance
        run: pnpm run quality

      - name: construct doctor
        working-directory: ${{ runner.temp }}/acceptance
        run: |
          "$CONSTRUCT_BIN" doctor --plain

  required:
    needs: [changes, checks, lint, typecheck, vitest, docs, package, contract-bump, acceptance]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: pnpm exec tsx scripts/ci/verdict.ts
      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true
      - name: doctor reads this repository's harness as checked (decision 0033)
        run: |
          pnpm vitest run --merge-reports --reporter=json --outputFile=.construct/reports/vitest.json
          pnpm --silent dev doctor --json > "$RUNNER_TEMP/doctor.json"
          node -e 'const state = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).harness.state; if (state !== "checked") { console.error(`doctor reads harness.state ${state}, not "checked"`); process.exit(1) }' "$RUNNER_TEMP/doctor.json"
