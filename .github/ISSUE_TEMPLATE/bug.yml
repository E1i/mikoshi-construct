name: Bug
description: construct init, doctor, soulkill or cost did something wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: mikoshi-construct version
      placeholder: construct --version
    validations:
      required: true
  - type: textarea
    id: soulkill
    attributes:
      label: Output of `construct soulkill --json`
      render: json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
