  '@types/supertest': ^7.2.1
  eslint: ^10.10.0
  express: ^4.21.2
  express-openapi-validator: ^5.6.2
  openapi-typescript: ^7.13.0
  supertest: ^7.2.2
  tsx: ^4.23.13
  typescript: ^5.9.3
  vitest: ^5.0.0
  yaml: ^2.9.1
